# Publish mcp/ to npm as mitoage-mcp. Site deploys follow every push to main (deploy.yml); the
# package does not, so that the two cadences never force each other. Release by tagging:
#
#   git tag mcp-v0.1.0 && git push origin mcp-v0.1.0
#
# The tag must match the version in mcp/package.json, and the server must name a dataset revision:
# a published version that is not pinned to a build would hand its users whatever the dataset holds
# that day.
name: Publish mitoage-mcp

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: The tag names the version in mcp/package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#mcp-v}"
          packaged=$(node -p "require('./mcp/package.json').version")
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, mcp/package.json says $packaged"
            exit 1
          fi

      - run: bun run check
      - run: bun test
      - run: bun run --cwd mcp build

      - name: The server names a dataset revision
        run: |
          node --input-type=module -e "
            const { DATASET } = await import('./mcp/dist/dataset.js');
            if (!DATASET.revision) {
              console.error('mcp/src/dataset.ts has no revision: set it to the dataset commit that holds mitoage.sqlite before releasing');
              process.exit(1);
            }
            if (!/^[0-9a-f]{40}$/.test(DATASET.revision)) {
              console.error('the revision ' + DATASET.revision + ' is not a full commit SHA; a branch would change under the people who install this');
              process.exit(1);
            }
          "

      - run: npm publish --provenance --access public
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

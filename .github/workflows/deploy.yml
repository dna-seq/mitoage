name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE_URL: https://just-dna.life
          BASE_PATH: /mitoage
      # Every internal URL must go through href() (src/lib/url.ts). Fail instead of patching dist,
      # so a hard-coded root-absolute path is fixed in the source.
      - name: Check links carry the base path
        run: |
          if grep -rnoP '\b(href|src|action)="/(?!mitoage/|/)[^"]*"' dist --include='*.html' | head -20 | grep .; then
            echo "::error::The links above miss the /mitoage/ base path. Build them with href() from src/lib/url.ts."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

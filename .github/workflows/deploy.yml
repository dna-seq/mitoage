name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE_URL: https://just-dna.life
          BASE_PATH: /mitoage
      # Safety net: prefix any root-absolute link that missed the base path.
      - name: Prefix leftover root-absolute links
        run: find dist -name '*.html' -print0 | xargs -0 perl -pi -e 's#\b(href|src|action)="/(?!mitoage/|/)#$1="/mitoage/#g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

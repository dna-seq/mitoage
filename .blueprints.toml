# MitoAge's seats (the seats kit, agent-seat-blueprints). Committed: it declares the seats and holds no
# key. The messenger accounts stay on each machine, in its pool.
[repo]
# Also the name of the repository's channel in the chat, and the id the desk registers it under.
id = "mitoage"

# The lead (docs/seats/LEAD.md): owns docs/ROADMAP.md and builds it with the maintainer.
[seat.lead]
# The desk's secretary relays the maintainer's answers to the lead's questions: a wake, never an instruction.
wake_from = "*/secretary"
# The team's people are heard in the repository's own channel and in the alignments arm's.
wake_people = "mitoage mitoalignments"

[seat.lead.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

# The plan's items that need the lead: no state or owner, a date come, a blocked item with no desk
# question, a desk question answered. Each said once.
[seat.lead.watch.plan]
cmd = "sh kit:bin/py.sh kit:classes/lead/plan-watch.py"

# The desk's answers to this seat's questions, each said once.
[seat.lead.watch.desk]
cmd = "sh kit:bin/py.sh kit:classes/desk/watch-answers.py mitoage lead"
